name: check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-python: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run acceptance gate
        run: uv run python scripts/check.py
